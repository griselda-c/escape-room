<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Final</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            background-image: url('correcto.webp'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            box-sizing: border-box; 
            margin: 0;
            padding: 20px;
        }

        input, button { 
            padding: 10px; 
            font-size: 16px; 
            margin: 10px; 
        } 

        .flex {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            max-width: 800px;
        }

        h1 {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: bold; 
            color: #eae1d4; 
            font-size: clamp(2.2rem, 5vw, 3.5rem); /* Se adapta dinámicamente al tamaño de la pantalla */
            line-height: 1.1; 
            text-align: center; 
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6); 
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-family: 'Georgia', 'Times New Roman', serif; 
            font-style: italic; 
            color: #eae1d4; 
            font-size: clamp(1.1rem, 3vw, 1.4rem); 
            line-height: 1.5; 
            text-align: center; 
            margin: 0 0 15px 0; 
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .mensaje { 
            font-family: 'Arial', 'Helvetica', sans-serif; 
            font-style: normal; 
            color: #eae1d4; 
            font-weight: bold; 
            font-size: clamp(1rem, 2.5vw, 1.3rem); 
            line-height: 1.6; 
            text-align: center; 
            margin: 15px 0 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .firma-autor {
            display: block; 
            margin-top: 10px; 
            font-size: 1.1rem; 
            color: #f3ebdf; 
            font-weight: normal;
        }

        .retrato {
            width: 100%; 
            max-width: 180px; 
            height: auto; 
            border-radius: 12px; 
            margin: 10px 0; 
            border: 3px solid #eae1d4; 
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            filter: sepia(20%);
        }
    </style>
</head>
<body>
    <div class="flex">
        <h1>Código Correcto</h1>
        <p>Has conseguido interpretar los símbolos. <br> Se ha revelado un mensaje ante ti.</p>
        <img src="rene.jpg" alt="Doctor René Favaloro" class="retrato">
        <p class="mensaje">“El genio no existe. <br>
            Existe el trabajo, el esfuerzo y la dedicación.”
            <span class="firma-autor">— Dr. René Favaloro</span>
        </p>
    </div>
</body>
</html>
