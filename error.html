<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Final</title>
    <style>
        /* Configuramos el fondo completo y responsive ocupando el 100% de la pantalla */
        body { 
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; 
            background-image: url('error.webp'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            
            /* Centramos todo el contenido vertical y horizontalmente sobre el pergamino */
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-family: 'Arial', 'Helvetica', sans-serif; 
            text-align: center;
            box-sizing: border-box;
        }

        /* Contenedor flexible de los textos y el botón */
        .flex {
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        
        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: #ff4d4d; 
            font-size: 3rem;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        p {
            color: #eae1d4; 
            font-size: 1.6rem; 
            font-weight: bold; 
            margin: 0 0 30px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        button { 
            background-color: #e67e22; /* Color naranja llamativo que combina con el pergamino */
            color: #ffffff;
            border: none;
            padding: 14px 35px; 
            font-size: 1.2rem; 
            font-weight: bold;
            border-radius: 25px; /* Bordes redondeados modernos */
            cursor: pointer;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease; /* Transición suave para el efecto visual */
        } 

        /* Efecto visual cuando los chicos pasan el cursor por encima */
        button:hover {
            background-color: #d35400; /* Se oscurece un poco */
            transform: scale(1.05); /* Crece sutilmente */
            box-shadow: 0px 7px 20px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
   <div class="flex">
        <h1>RESPUESTA INCORRECTA</h1>
        <p>Algo no salió bien...</p>
        <!-- Corregido el tilde en Inténtalo -->
        <button onclick="volver()">Inténtalo de nuevo</button>
   </div>

    <script>
        function volver() {
           window.location.href = 'index.html';
        }
    </script>
</body>
</html>
